<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MLOps 星際學院 — 完全攻略版</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{overflow:hidden;background:#020510;font-family:'Segoe UI',sans-serif;color:#e2e8f0;height:100vh;touch-action:none;}
#canvas-bg{position:fixed;inset:0;z-index:0;}

/* Screens */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;transition:opacity 0.5s ease;}
.hidden{display:none!important;}
.fade-out{opacity:0;pointer-events:none;}

/* Glass */
.glass{background:rgba(8,12,28,0.88);backdrop-filter:blur(14px);border:1px solid rgba(139,92,246,0.26);border-radius:1rem;box-shadow:0 4px 30px rgba(0,0,0,0.7),inset 0 0 20px rgba(99,102,241,0.05);}
.glass-sm{border-radius:0.6rem;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:rgba(10,15,35,0.5);}
::-webkit-scrollbar-thumb{background:#6d28d9;border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#8b5cf6;}

/* Neon text */
.neon{text-shadow:0 0 8px rgba(167,139,250,0.8),0 0 20px rgba(167,139,250,0.3);}
.neon-sky{text-shadow:0 0 8px rgba(56,189,248,0.8),0 0 20px rgba(56,189,248,0.3);}
.neon-em{text-shadow:0 0 8px rgba(52,211,153,0.8),0 0 20px rgba(52,211,153,0.3);}

/* Mission Cards */
.m-card{background:rgba(10,15,35,0.92);border:1px solid rgba(99,102,241,0.22);border-radius:1.25rem;padding:1.4rem;cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden;}
.m-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 50%,rgba(139,92,246,0.04));pointer-events:none;}
.m-card:hover:not(.locked){transform:translateY(-4px) scale(1.02);border-color:rgba(167,139,250,0.65);box-shadow:0 10px 35px rgba(99,102,241,0.3);}
.m-card.locked{opacity:0.32;cursor:not-allowed;filter:grayscale(0.6);}
.m-card.done{border-color:rgba(52,211,153,0.45);}
.m-card.done::after{background:linear-gradient(135deg,transparent 50%,rgba(52,211,153,0.06));}

/* Lifecycle bar */
.lc-wrap{background:rgba(4,6,18,0.95);border-bottom:1px solid rgba(99,102,241,0.14);padding:0.6rem 1rem;display:flex;align-items:center;gap:0.2rem;overflow-x:auto;flex-shrink:0;}
.lc-node{display:flex;align-items:center;gap:0.3rem;padding:0.3rem 0.6rem;border-radius:999px;font-size:0.75rem;font-weight:700;white-space:nowrap;border:1px solid transparent;transition:all 0.3s;cursor:default;}
.lc-node.cur{background:rgba(139,92,246,0.2);border-color:#8b5cf6;color:#ddd6fe;box-shadow:0 0 12px rgba(139,92,246,0.4);}
.lc-node.ok{background:rgba(52,211,153,0.15);border-color:rgba(52,211,153,0.4);color:#6ee7b7;}
.lc-node.dim{color:#475569;}
.lc-sep{color:#1e2d45;font-size:1rem;padding:0 0.1rem;}

/* Sliders */
.sl{-webkit-appearance:none;width:100%;height:6px;background:#1e293b;border-radius:3px;outline:none;cursor:pointer;}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;cursor:pointer;transition:all 0.2s;}
.sl::-webkit-slider-thumb:hover{transform:scale(1.2);}
.sl.p::-webkit-slider-thumb{background:#a78bfa;box-shadow:0 0 8px rgba(167,139,250,0.8);}
.sl.s::-webkit-slider-thumb{background:#38bdf8;box-shadow:0 0 8px rgba(56,189,248,0.8);}
.sl.a::-webkit-slider-thumb{background:#fb923c;box-shadow:0 0 8px rgba(251,146,60,0.8);}

/* Toggle */
.tog{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;cursor:pointer;inset:0;background:#334155;border-radius:12px;transition:0.3s;}
.tog-sl:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#cbd5e1;border-radius:50%;transition:0.3s;}
input:checked+.tog-sl{background:#8b5cf6;}
input:checked+.tog-sl:before{transform:translateX(20px);background:#f3e8ff;}
.tog.em input:checked+.tog-sl{background:#10b981;}

/* Pipeline step */
.ps{display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0.85rem;background:rgba(18,26,52,0.6);border:1px solid rgba(99,102,241,0.25);border-radius:0.6rem;transition:all 0.2s;cursor:pointer;user-select:none;}
.ps:hover{border-color:rgba(139,92,246,0.6);background:rgba(99,102,241,0.15);}
.ps.on{background:rgba(99,102,241,0.2);border-color:rgba(99,102,241,0.6);}
.ps.ok{background:rgba(52,211,153,0.12);border-color:rgba(52,211,153,0.4);}

/* Quiz options */
.qo{width:100%;text-align:left;padding:0.85rem 1.2rem;margin-bottom:0.6rem;background:rgba(18,26,52,0.65);border:1px solid rgba(99,102,241,0.3);border-radius:0.6rem;color:#f1f5f9;font-size:1rem;font-weight:500;cursor:pointer;transition:all 0.2s;}
.qo:hover:not(:disabled){background:rgba(99,102,241,0.2);border-color:#8b5cf6;transform:translateX(4px);}
.qo.ok{background:rgba(16,185,129,0.2);border-color:#10b981;color:#a7f3d0;}
.qo.bad{background:rgba(239,68,68,0.2);border-color:#ef4444;color:#fecaca;}

/* Modal */
.mOv{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;background:rgba(0,0,6,0.9);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity 0.3s;}
.mOv.open{opacity:1;pointer-events:auto;}
.mBox{background:linear-gradient(135deg,rgba(16,10,36,0.98),rgba(6,6,18,1));border:1px solid rgba(139,92,246,0.5);border-radius:1.25rem;box-shadow:0 0 60px rgba(99,102,241,0.25);padding:2rem;max-width:600px;width:93%;transform:translateY(24px);transition:transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275);max-height:88vh;overflow-y:auto;}
.mOv.open .mBox{transform:translateY(0);}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.4rem;padding:0.75rem 1.4rem;border-radius:0.55rem;font-weight:700;font-size:0.95rem;cursor:pointer;transition:all 0.2s;border:1px solid;}
.btn:active{transform:scale(0.96);}
.btn-p{background:rgba(109,40,217,0.45);border-color:#8b5cf6;color:#f3e8ff;}
.btn-p:hover:not(:disabled){background:rgba(109,40,217,0.75);box-shadow:0 0 18px rgba(139,92,246,0.4);}
.btn-s{background:rgba(30,41,59,0.7);border-color:rgba(99,102,241,0.4);color:#cbd5e1;}
.btn-s:hover:not(:disabled){background:rgba(51,65,85,0.9);color:#f8fafc;}
.btn-g{background:rgba(5,150,105,0.35);border-color:#10b981;color:#a7f3d0;}
.btn-g:hover:not(:disabled){background:rgba(5,150,105,0.6);box-shadow:0 0 15px rgba(16,185,129,0.4);}
.btn-a{background:rgba(180,83,9,0.35);border-color:#f59e0b;color:#fde68a;}
.btn-a:hover:not(:disabled){background:rgba(180,83,9,0.6);}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.w100{width:100%;justify-content:center;}

/* Tags */
.tag{font-size:0.75rem;font-weight:700;padding:0.2rem 0.6rem;border-radius:999px;display:inline-block;}

/* XP Bar */
.xpbar{height:8px;background:#1e293b;border-radius:4px;overflow:hidden;position:relative;}
.xpfill{height:100%;background:linear-gradient(90deg,#7c3aed,#8b5cf6,#a78bfa);border-radius:4px;transition:width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);}

/* Metric card & Status dot */
.mc{background:rgba(15,23,42,0.8);border:1px solid rgba(99,102,241,0.25);border-radius:0.6rem;padding:0.75rem 1rem;}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.sdot.ok{background:#34d399;box-shadow:0 0 8px #34d399;}
.sdot.warn{background:#fb923c;box-shadow:0 0 8px #fb923c;}
.sdot.err{background:#f87171;box-shadow:0 0 8px #f87171;}
.sdot.dim{background:#475569;}

/* Responsive Layout for Mission Screen */
.panel-container { flex:1; display:flex; gap:1rem; padding:1rem; overflow:hidden; }
.panel-controls { width:320px; flex-shrink:0; padding:1.2rem; overflow-y:auto; }
.panel-center { flex:1; display:flex; flex-direction:column; gap:1rem; overflow:hidden; min-width:0; }
.panel-info { width:300px; flex-shrink:0; padding:1.2rem; overflow-y:auto; }

@media (max-width: 1024px) {
  .panel-container { flex-direction:column; overflow-y:auto; padding-bottom: 2rem; touch-action: pan-y; }
  .panel-controls, .panel-info { width:100%; flex:none; height:auto; overflow:visible; }
  .panel-center { overflow:visible; }
  .panel-viz { min-height: 450px; }
  body { overflow-y: auto; }
}

/* Animations */
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fadein{animation:fadein 0.4s ease forwards;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.float{animation:float 4s ease-in-out infinite;}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 12px rgba(139,92,246,0.4);}50%{box-shadow:0 0 28px rgba(139,92,246,0.7);}}
.pulse-glow{animation:pulseGlow 2s infinite;}

.exp-row{display:grid;grid-template-columns:0.5fr 1fr 1fr 1fr 1fr;gap:0.25rem;padding:0.5rem 0.6rem;border-bottom:1px solid rgba(99,102,241,0.15);font-size:0.8rem;align-items:center;}
.exp-row:last-child{border-bottom:none;}

/* Scenarios & Strats */
.scn{padding:0.75rem 1rem;background:rgba(15,23,42,0.7);border:1px solid rgba(99,102,241,0.3);border-radius:0.75rem;cursor:pointer;transition:all 0.22s;text-align:left;width:100%;}
.scn:hover{border-color:rgba(139,92,246,0.6);background:rgba(99,102,241,0.2);}
.scn.pick{border-color:#a78bfa;background:rgba(139,92,246,0.2);box-shadow:0 0 16px rgba(139,92,246,0.3);}
.sto{padding:0.6rem 0.85rem;background:rgba(15,23,42,0.7);border:1px solid rgba(99,102,241,0.3);border-radius:0.6rem;cursor:pointer;transition:all 0.2s;font-size:0.85rem;width:100%;text-align:left;color:#e2e8f0;}
.sto:hover:not(:disabled){background:rgba(99,102,241,0.2); transform:translateX(4px);}
.sto.ok{background:rgba(16,185,129,0.2);border-color:#10b981;color:#a7f3d0;}
.sto.bad{background:rgba(239,68,68,0.2);border-color:#ef4444;color:#fecaca;}

/* Drag wheel */
#drag-wheel{border:2px solid rgba(56,189,248,0.4);border-radius:50%;background:rgba(8,15,38,0.9);cursor:grab;position:relative;touch-action:none;}
#drag-wheel:active{cursor:grabbing;}
</style>
</head>
<body>

<!-- 3D Background -->
<div id="canvas-bg"></div>

<!-- ===================== SCREEN: TITLE ===================== -->
<div id="screen-title" class="screen" style="justify-content:center;align-items:center;background:rgba(2,5,16,0.6);backdrop-filter:blur(8px);">
  <div class="text-7xl mb-6 float">🚀</div>
  <h1 class="text-5xl md:text-6xl font-black neon mb-4 text-center" style="color:#a78bfa; letter-spacing: 2px;">MLOps 星際學院</h1>
  <p class="text-lg md:text-xl text-center mb-10 px-4" style="color:#cbd5e1; max-width: 650px; line-height: 1.6;">
    系統化掌握機器學習生產化全流程。<br>從資料清洗到模型監控，成為宇宙頂尖的 AI 領航員。
  </p>
  <button onclick="initGame()" class="btn btn-p pulse-glow text-lg px-8 py-4" style="border-radius: 1rem;">
    🌌 啟動引擎開始訓練
  </button>
</div>

<!-- ===================== SCREEN: MAP ===================== -->
<div id="screen-map" class="screen hidden" style="overflow-y:auto; touch-action: pan-y;">
  <div style="min-height:100vh;padding:2rem 1.5rem;display:flex;flex-direction:column;align-items:center;">
    <!-- Header -->
    <div class="text-center mb-8" style="margin-top:2vh;">
      <h1 class="text-4xl font-black neon mb-2" style="color:#c4b5fd;">任務地圖</h1>
      <p class="text-base text-slate-200">完成各階段測驗以解鎖下一關</p>
      <div class="flex items-center gap-3 justify-center mt-5 bg-black/50 p-3 rounded-full border border-indigo-400/40">
        <span class="text-sm font-bold text-purple-300">🏆 學院積分</span>
        <div class="xpbar" style="width:200px;"><div id="map-xpbar" class="xpfill" style="width:0%;"></div></div>
        <span id="map-xptext" class="text-sm font-bold w-16 text-right text-purple-200">0 / 600</span>

    <!-- MLOps Lifecycle Arrow -->
    <div class="glass mb-8 hidden lg:block" style="padding:0.8rem 1.4rem;max-width:1000px;width:100%;">
      <div class="flex items-center gap-2 flex-wrap justify-center text-sm">
        <span class="font-black text-slate-300">生命週期：</span>
        <span class="tag text-sky-300 bg-sky-500/20 border border-sky-400/40">📊 DataOps</span><span class="text-slate-400">→</span>
        <span class="tag text-purple-300 bg-purple-500/20 border border-purple-400/40">🧪 實驗追蹤</span><span class="text-slate-400">→</span>
        <span class="tag text-orange-300 bg-orange-500/20 border border-orange-400/40">⚙️ CI/CD</span><span class="text-slate-400">→</span>
        <span class="tag text-indigo-300 bg-indigo-500/20 border border-indigo-400/40">🚀 部署策略</span><span class="text-slate-400">→</span>
        <span class="tag text-emerald-300 bg-emerald-500/20 border border-emerald-400/40">📡 監控</span><span class="text-slate-400">→</span>
        <span class="tag text-rose-300 bg-rose-500/20 border border-rose-400/40">🔄 再訓練</span>
      </div>
    </div>

    <!-- Mission Grid -->
    <div id="mission-grid" class="grid gap-6 w-full" style="max-width:1000px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));"></div>
  </div>
</div>

<!-- ===================== SCREEN: MISSION ===================== -->
<div id="screen-mission" class="screen hidden" style="background:rgba(2,5,16,0.4);">
  <!-- Lifecycle bar -->
  <div class="lc-wrap" id="lc-bar">
    <button onclick="exitMission()" class="hover:text-indigo-200 transition-colors" style="font-size:0.9rem;color:#a78bfa;font-weight:700;margin-right:0.75rem;white-space:nowrap;background:none;border:none;cursor:pointer;">← 返回地圖</button>

  </div>

  <!-- Responsive 3-Panel Layout -->
  <div class="panel-container">

    <div class="glass panel-controls" id="panel-controls"></div>

    <!-- CENTER: Viz + Header -->
    <div class="panel-center">
      <div class="glass fadein" id="panel-header" style="padding:1.2rem;flex-shrink:0;"></div>
      <div class="glass overflow-auto fadein" id="panel-viz" style="flex:1;padding:1.2rem;"></div>
    </div>

    <!-- RIGHT: Info/Concepts -->
    <div class="glass fadein panel-info" id="panel-info"></div>
  </div>
</div>

<!-- ===================== MODAL: Quiz ===================== -->
<div id="m-quiz" class="mOv">
  <div class="mBox">
    <div class="flex items-center gap-2 mb-4">
      <div id="q-dots" class="flex gap-2"></div>
      <span id="q-progress" class="text-base font-bold ml-auto text-purple-400"></span>
    </div>
    <div class="flex gap-4 items-start mb-6">
      <div id="q-avatar" class="text-5xl flex-shrink-0">🤖</div>
      <div id="q-speech" class="text-base p-4 rounded-xl rounded-tl-sm leading-relaxed" style="background:rgba(30,41,59,0.9);border:1px solid rgba(139,92,246,0.4);color:#f8fafc;flex:1;"></div>
    </div>
    <div id="q-question" class="font-bold text-lg text-white border-b pb-4 mb-5" style="border-color:rgba(139,92,246,0.3);"></div>
    <div id="q-options" class="space-y-3"></div>
    <div id="q-feedback" class="hidden mt-4 p-4 rounded-lg text-base leading-relaxed"></div>
    <div class="mt-6 flex gap-3">
      <button id="q-next" class="btn btn-p w100 hidden py-3 text-lg">下一題 →</button>
      <button id="q-finish" class="btn btn-g pulse-glow w100 hidden py-3 text-lg">✅ 完成測驗 ·結算 XP</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL: Mission Complete ===================== -->
<div id="m-complete" class="mOv">
  <div class="mBox text-center">
    <div id="mc-emoji" class="text-6xl mb-4 float">🏆</div>
    <h2 class="text-4xl font-black mb-2 text-purple-300">任務完成！</h2>
    <div id="mc-subtitle" class="text-lg mb-6 text-slate-300"></div>
    <div class="flex justify-center gap-6 mb-6">
      <div class="mc text-center" style="min-width:120px;"><div id="mc-xp" class="text-4xl font-black text-orange-400">+100</div><div class="text-sm mt-1 text-slate-300">XP 獲得</div></div>
      <div class="mc text-center" style="min-width:120px;"><div id="mc-score" class="text-4xl font-black text-emerald-400"></div><div class="text-sm mt-1 text-slate-300">正確率</div></div>
    </div>
    <div id="mc-summary" class="text-left mb-6 p-5 rounded-xl text-base leading-relaxed" style="background:rgba(15,23,42,0.8);border:1px solid rgba(139,92,246,0.3);color:#e2e8f0;"></div>
    <div id="mc-unlock-msg" class="text-lg font-bold mb-6 pulse-glow inline-block px-5 py-2 rounded-full" style="color:#6ee7b7; background: rgba(16,185,129,0.15);"></div>
    <div class="flex gap-3">
      <button onclick="closeMissionComplete()" class="btn btn-s w100 py-3 text-base">← 返回地圖</button>
      <button id="mc-next-btn" class="btn btn-g w100 hidden py-3 text-base">前往下一關 🚀</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL: MLOps Reference ===================== -->
<div id="m-ref" class="mOv">
  <div class="mBox">
    <div class="flex items-center gap-3 mb-5 border-b border-indigo-500/40 pb-3">
      <span class="text-3xl">📚</span>
      <h3 class="text-2xl font-black text-purple-300 flex-1">MLOps 星際詞典</h3>
      <button onclick="closeModal('m-ref')" class="hover:text-white transition-colors" style="color:#94a3b8;font-size:2rem;background:none;border:none;cursor:pointer;">&times;</button>
    </div>
    <div id="ref-body" class="space-y-6 text-base text-slate-200 leading-relaxed"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// SOUND ENGINE (Web Audio API)
// ═══════════════════════════════════════════════════
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function playSound(type) {
  if (!actx || actx.state !== 'running') return;
  try {
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.connect(gain); gain.connect(actx.destination);
    const now = actx.currentTime;
    
    if (type === 'click') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'success') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.setValueAtTime(600, now + 0.1);
      osc.frequency.setValueAtTime(800, now + 0.2);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.4);
      osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'fail') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.linearRampToValueAtTime(150, now + 0.3);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'warp') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(100, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.8);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.2, now + 0.4);
      gain.gain.linearRampToValueAtTime(0, now + 0.8);
      osc.start(now); osc.stop(now + 0.8);
    }
  } catch (e) {}
}

// ═══════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════
const MISSIONS = [
  {
    id:0, name:'DataOps 資料管線', icon:'📊', color:'sky', xp:100,

// ═══════════════════════════════════════════════════
// THREE.JS
// ═══════════════════════════════════════════════════
let scene, camera, renderer, starGeo, stars, lastTime=0;
let spaceship=null, engineLight=null, asteroids=[], crystals=[];
let currentWarpSpeed = 1;

function init3D() {
  const c = document.getElementById('canvas-bg');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x020510, 0.007);
  camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(0,4,15); camera.lookAt(0,0,-10);
  renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Opt for performance
  c.appendChild(renderer.domElement);
  
  scene.add(new THREE.AmbientLight(0xffffff, 0.18));
  const dl = new THREE.DirectionalLight(0xa78bfa, 0.8);
  dl.position.set(5,10,5); scene.add(dl);
  
  createStars(); createSpaceship(); createDebris();
  
  window.addEventListener('resize', ()=>{ 
    camera.aspect=innerWidth/innerHeight; 
    camera.updateProjectionMatrix(); 
    renderer.setSize(innerWidth,innerHeight); 
  });
  lastTime = performance.now();
  requestAnimationFrame(animate3D);
}

function createStars() {
  starGeo = new THREE.BufferGeometry();
  const pos = new Float32Array(2400);
  for(let i=0;i<2400;i++) pos[i]=(Math.random()-0.5)*500;
  starGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff,size:0.6,transparent:true,opacity:0.6}));
  scene.add(stars);
}

function createSpaceship() {
  spaceship = new THREE.Group();
  const hullG = new THREE.CylinderGeometry(0.5,1.5,6,8); hullG.rotateX(Math.PI/2);
  spaceship.add(new THREE.Mesh(hullG, new THREE.MeshStandardMaterial({color:0x1e293b,metalness:0.8,roughness:0.2})));
  const wingG = new THREE.BoxGeometry(6,0.2,2);
  const wingM = new THREE.Mesh(wingG, new THREE.MeshStandardMaterial({color:0x1e293b,metalness:0.8}));
  wingM.position.set(0,-0.5,1); spaceship.add(wingM);
  const cpG = new THREE.SphereGeometry(0.6,16,16); cpG.scale(1,2.5,1); cpG.rotateX(Math.PI/2);
  const cpM = new THREE.Mesh(cpG, new THREE.MeshStandardMaterial({color:0x0ea5e9,metalness:0.9,roughness:0.1,emissive:0x0284c7,emissiveIntensity:0.3}));
  cpM.position.set(0,0.8,-1); spaceship.add(cpM);
  engineLight = new THREE.PointLight(0x8b5cf6,2.5,20); engineLight.position.set(0,0,3.5); spaceship.add(engineLight);
  const fG = new THREE.ConeGeometry(0.8,3,8); fG.rotateX(-Math.PI/2);
  const fM = new THREE.Mesh(fG, new THREE.MeshBasicMaterial({color:0x8b5cf6,transparent:true,opacity:0.8}));
  fM.position.set(0,0,4.5); spaceship.add(fM);
  spaceship.position.set(0,0,-5); scene.add(spaceship);
}

function createDebris() {
  const gA = new THREE.DodecahedronGeometry(1.5,0);
  const gC = new THREE.OctahedronGeometry(1,0);
  for(let i=0;i<20;i++){
    const m = new THREE.Mesh(gA, new THREE.MeshStandardMaterial({color:0x64748b,roughness:0.8}));
    m.position.set((Math.random()-0.5)*40,(Math.random()-0.5)*20,-100-Math.random()*100);
    m.rotation.set(Math.random(),Math.random(),Math.random());
    m.userData={speed:20+Math.random()*15, rot:Math.random()*0.05};
    asteroids.push(m); scene.add(m);
  }
  for(let i=0;i<6;i++){
    const m = new THREE.Mesh(gC, new THREE.MeshStandardMaterial({color:0x10b981,emissive:0x059669,metalness:0.8}));
    m.position.set((Math.random()-0.5)*30,(Math.random()-0.5)*10,-100-Math.random()*100);
    m.userData={speed:15, rot:0.08};
    m.visible=false; crystals.push(m); scene.add(m);
  }
}

function animate3D() {
  requestAnimationFrame(animate3D);
  const now = performance.now();
  const dt = Math.min((now-lastTime)/1000, 0.05); lastTime=now;
  
  // Warp logic
  const targetWarp = S.warping ? 15 : 1;
  currentWarpSpeed += (targetWarp - currentWarpSpeed) * dt * 5;
  
  // Stars
  const baseSpd = S.isCrashed ? 0.2 : (1+S.klScore*1.5);
  const spd = baseSpd * currentWarpSpeed;
  
  if (S.warping) stars.material.size = 2; // stretch stars
  else stars.material.size = 0.6;
  
  const pos = starGeo.attributes.position.array;
  for(let i=2;i<2400;i+=3){ 
    pos[i] += 45 * spd * dt; 
    if(pos[i]>50) pos[i]-=500; 
  }
  starGeo.attributes.position.needsUpdate=true;
  
  // Asteroids (mission 4)
  if(S.curMission===4 || S.screen==='map' || S.screen==='title'){
    asteroids.forEach(a=>{
      a.position.z += a.userData.speed * spd * dt; 
      a.rotation.x += a.userData.rot; a.rotation.y += a.userData.rot;
      if(a.position.z>10){ 
        a.position.z = -100-Math.random()*50; 
        a.position.x = (Math.random()-0.5)*40; 
        a.position.y = (Math.random()-0.5)*20;
        const r=Math.random();
        if(r<S.live_P[0]) a.material.color.setHex(0x64748b);
        else if(r<S.live_P[0]+S.live_P[1]) { a.material.color.setHex(0x22d3ee); a.material.emissive={r:0.02,g:0.3,b:0.4}; }
        else { a.material.color.setHex(0xd946ef); }
      }
    });
    crystals.forEach(c=>{ 
      c.visible = S.isConcept; 
      if(S.isConcept){ 
        c.position.z += c.userData.speed*dt; c.rotation.y+=c.userData.rot; 
        if(c.position.z>10){c.position.z=-80-Math.random()*40;c.position.x=(Math.random()-0.5)*20;c.position.y=(Math.random()-0.5)*10;} 
      } 
    });
    
    if(S.isCrashed){ 
      spaceship.rotation.z+=4*dt; spaceship.rotation.x+=1.5*dt; spaceship.position.y-=1.5*dt; 
      engineLight.color.setHex(0xff2200); 
    } else { 
      engineLight.color.setHex(0x8b5cf6); 
      const w = Math.max(0, S.mse-0.1)*1.5; 
      spaceship.position.x += (Math.random()-0.5)*w; 
      spaceship.position.y += (Math.random()-0.5)*w; 
      const tr = -spaceship.position.x*0.08; 
      spaceship.rotation.z += (tr-spaceship.rotation.z)*5*dt; 
      spaceship.rotation.x = 0; 
      spaceship.position.y += (0-spaceship.position.y)*1.5*dt; 
    }
  } else {
    // Other missions: gentle float
    asteroids.forEach(a=> a.position.z = 100); // Hide
    const t = now/1000;
    spaceship.position.x = Math.sin(t*0.3)*2;
    spaceship.position.y = Math.sin(t*0.5)*1;
    spaceship.rotation.z = Math.sin(t*0.4)*0.1;
    spaceship.rotation.x = 0;
    engineLight.color.setHex(0x8b5cf6);
  }
  renderer.render(scene,camera);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => {
    if(!s.classList.contains('hidden')){
      s.classList.add('fade-out');
      setTimeout(()=> {
        s.classList.add('hidden');
        s.classList.remove('fade-out');
      }, 500);
    }
  });
  
  setTimeout(() => {
    const next = document.getElementById(id);
    next.classList.remove('hidden');
    next.classList.remove('fade-out');
  }, 500);
}

function openModal(id){ document.getElementById(id).classList.add('open'); playSound('click'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); playSound('click'); }

function initGame() {
  initAudio();
  playSound('warp');
  S.warping = true;
  showScreen('screen-map');
  renderMap();
  setTimeout(()=> { S.warping = false; }, 1200);
}

function exitMission(){
  playSound('click');
  S.curMission = -1; S.screen = 'map';
  showScreen('screen-map'); renderMap();
}

function startMission(id){
  if(!S.unlocked.has(id)) {
    playSound('fail');
    return;
  }
  initAudio();
  playSound('warp');
  S.warping = true;
  
  setTimeout(()=> {
    S.warping = false;
    const m = MISSIONS[id];
    S.curMission = id; S.screen = 'mission';
    showScreen('screen-mission');
    renderLifecycleBar(id);
    renderMissionHeader(m);
    renderControls(id);
    renderViz(id);
    renderInfo(id);
  }, 800); // Wait for warp effect
}

function onM0Contam(v){ S.m0Contam=parseInt(v); document.getElementById('m0-contam-val').textContent=v+'%'; }
function runM0Validation(){
  playSound('click');
  const r = document.getElementById('m0-result');
  let msg = '';
  let passed = true;

  if(!S.m0Steps[0]) { passed = false; msg += `❌ 缺少「資料清洗」步驟。<br>`; }
  if(!S.m0Steps[2]) { passed = false; msg += `❌ 缺少「Schema 驗證」步驟！<br>`; }
  if(!S.m0Steps[4]) { passed = false; msg += `❌ 缺少「時序切分」！可能產生 Data Leakage。<br>`; }

  if(S.m0Contam > 0 && !S.m0Steps[0]) {
    msg = `❌ 偵測到 ${S.m0Contam}% 資料污染，必須啟用「資料清洗」！<br>` + msg.replace(`❌ 缺少「資料清洗」步驟。<br>`, '');
  }

  if(passed){
    playSound('success');
    let extraMsg = S.m0Contam > 0 ? `🧹 已成功過濾 ${S.m0Contam}% 的污染資料。<br>` : '';
    r.innerHTML=`<div class="bg-emerald-400/15 border border-emerald-400/40 rounded-lg p-4 text-emerald-300 leading-relaxed font-bold">✅ 資料管線驗證通過！<br><span class="text-emerald-200 font-normal">${extraMsg}所有 Great Expectations 規則均滿足。資料已 DVC 版本化。</span><br><span class="text-emerald-400 text-xs mt-2 inline-block">特徵商店已同步最新版本。</span></div>`;
  } else {
    playSound('fail');
    r.innerHTML=`<div class="bg-rose-400/15 border border-rose-400/40 rounded-lg p-4 text-rose-300 leading-relaxed font-bold">${msg}<span class="text-rose-200 font-normal">請修正上述問題後重試。</span></div>`;
  }
}

function onM1BS(v){ S.m1BS=[8,16,32,64,128,256][parseInt(v)]||32; document.getElementById('m1-bs-v').textContent=S.m1BS; }
function onM1EP(v){ S.m1Epochs=parseInt(v); document.getElementById('m1-ep-v').textContent=v; }
function runM1Experiment(){
  playSound('click');
  const lrScore = S.m1LR>0.0001 && S.m1LR<0.005 ? 0.12 : -0.08;
  const bsScore = (S.m1BS===32 || S.m1BS===64) ? 0.05 : -0.03;
  const epScore = S.m1Epochs>=10 ? Math.min(0.1,(S.m1Epochs-10)*0.005) : -0.05;
  const noise = (Math.random()-0.5)*0.06;
  const acc = Math.max(0.5, Math.min(0.99, 0.78 + lrScore + bsScore + epScore + noise));
  const loss = +(2-acc*1.8+Math.random()*0.15).toFixed(4);
  const runId = 'run-'+(S.m1Runs.length+1).toString().padStart(3,'0');
  
  S.m1Runs.push({id:runId, lr:S.m1LR, bs:S.m1BS, ep:S.m1Epochs, acc:+acc.toFixed(4), loss});
  S.m1BestIdx = S.m1Runs.reduce((bi,r,i)=>r.acc>S.m1Runs[bi].acc?i:bi, 0);
  
  renderViz(1);
  renderM1Controls(document.getElementById('panel-controls'));
}

function onM4Months(v){ S.months=parseInt(v); document.getElementById('m4-months-v').textContent=v+' 個月'; updateM4State(); }

function adaptConcept(){ playSound('success'); S.isAdapted=true; document.getElementById('m4-adapt-btn').classList.add('hidden'); updateM4State(); renderInfo(4); }
function resetM4(){ playSound('click'); S.live_P=[0.2,0.5,0.3]; S.months=1; S.isConcept=false; S.isAdapted=false; S.wheelAngle=0; renderM4Controls(document.getElementById('panel-controls')); updateM4State(); }
function updateM4State(){
  let kl=0;
  S.live_P.forEach((p,i)=>{ const q=Math.max([0.2,0.5,0.3][i],0.0001); kl+=Math.max(p,0.0001)*Math.log(Math.max(p,0.0001)/q); });
  S.klScore=kl;
  S.mse=0.05+Math.pow((S.months-1)/23,1.5)*1.35;
  const wasCrashed = S.isCrashed;
  S.isCrashed=(kl>0.80||S.mse>1.2);
  
  if (S.isCrashed && !wasCrashed) playSound('fail'); // Alarm
  
  const kld=document.getElementById('m4-kl'); if(kld) kld.textContent=kl.toFixed(3);
  const msed=document.getElementById('m4-mse'); if(msed) msed.textContent=S.mse.toFixed(2);
  renderInfo(4);
  renderViz(4);
}
function bindM4Wheel(){
  const wheel=document.getElementById('drag-wheel');
  if(!wheel) return;
  let dragging=false;
  const getAngle=(x,y)=>{
    const r=wheel.getBoundingClientRect();
    const dx=x-(r.left+r.width/2), dy=y-(r.top+r.height/2);
    let a=Math.atan2(dy,dx)*(180/Math.PI)+90;
    if(a>180)a-=360; if(a<-180)a+=360;
    return Math.max(-120,Math.min(120,a));
  };
  const apply=(a)=>{
    S.wheelAngle=a;
    const arrow=document.getElementById('m4-arrow'); if(arrow) arrow.setAttribute('transform',`rotate(${a},40,40)`);
    const t=a/120;
    if(t>=0){ S.live_P[0]=0.2+t*0.6; S.live_P[1]=0.5-t*0.4; S.live_P[2]=0.3-t*0.2; }
    else { const at=Math.abs(t); S.live_P[0]=0.2-at*0.15; S.live_P[1]=0.5-at*0.45; S.live_P[2]=0.3+at*0.60; }
    const sum=S.live_P[0]+S.live_P[1]+S.live_P[2];
    S.live_P=S.live_P.map(v=>v/sum);
    
    document.getElementById('v1d').textContent=(S.live_P[0]*100).toFixed(0)+'%';
    document.getElementById('v2d').textContent=(S.live_P[1]*100).toFixed(0)+'%';
    document.getElementById('v3d').textContent=(S.live_P[2]*100).toFixed(0)+'%';
    updateM4State();
  };
  wheel.addEventListener('mousedown',(e)=>{dragging=true;apply(getAngle(e.clientX,e.clientY));});
  window.addEventListener('mousemove',(e)=>{if(dragging)apply(getAngle(e.clientX,e.clientY));});
  window.addEventListener('mouseup',()=>{dragging=false;});
  wheel.addEventListener('touchstart',(e)=>{dragging=true;apply(getAngle(e.touches[0].clientX,e.touches[0].clientY));},{passive:false});
  window.addEventListener('touchmove',(e)=>{if(dragging){e.preventDefault();apply(getAngle(e.touches[0].clientX,e.touches[0].clientY));}},{passive:false});
  window.addEventListener('touchend',()=>{dragging=false;});
}

  const sc=M5_SCENARIOS[S.m5Picked];

          const picked=S.m5Scenarios[S.m5Picked]!==null;
          const isCorrect=i===sc.correct;
          let cls='sto';
          if(picked){
            const wasPickedWrong=!isCorrect && S.m5Scenarios[S.m5Picked]===false && i===S.m5LastPick;
            if(isCorrect) cls='sto ok'; else if(wasPickedWrong) cls='sto bad';
          }
          return `<button class="${cls}" onclick="answerM5(${i})" ${picked?'disabled':''}>
            ${isCorrect&&picked?'<span class="mr-2">✅</span>':''}${o}
          </button>`;
        }).join('')}
      </div>
      ${S.m5Scenarios[S.m5Picked]!==null?`

function answerM5(optIdx){
  const sc=M5_SCENARIOS[S.m5Picked];
  S.m5LastPick=optIdx;
  S.m5Scenarios[S.m5Picked]=(optIdx===sc.correct);
  if(optIdx===sc.correct) playSound('success'); else playSound('fail');
  renderViz(5);
  renderM5Controls(document.getElementById('panel-controls'));
}

// ═══════════════════════════════════════════════════
// QUIZ SYSTEM
// ═══════════════════════════════════════════════════
let QS={mission:-1, idx:0, correct:0, total:3, done:false};

function startQuiz(){
  playSound('click');
  const m=MISSIONS[S.curMission];
  QS={mission:S.curMission, idx:0, correct:0, total:m.quizzes.length, done:false};
  renderQuizQuestion();
  openModal('m-quiz');
}

function renderQuizQuestion(){
  const m=MISSIONS[QS.mission];
  const q=m.quizzes[QS.idx];
  document.getElementById('q-dots').innerHTML=m.quizzes.map((_,i)=>`
    <span class="inline-block w-3 h-3 rounded-full ${i<QS.idx?'bg-emerald-400':i===QS.idx?'bg-purple-500':'bg-slate-600'}"></span>
  `).join('');
  document.getElementById('q-progress').textContent=`${QS.idx+1} / ${QS.total}`;
  document.getElementById('q-avatar').textContent=q.avatar;
  document.getElementById('q-speech').textContent=q.speech;
  document.getElementById('q-question').textContent=q.q;
  
  const opts=document.getElementById('q-options'); opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='qo'; b.textContent=o;
    b.onclick=()=>answerQuiz(i, q.ans, q.fb, opts);
    opts.appendChild(b);
  });
  document.getElementById('q-feedback').className='hidden';
  document.getElementById('q-next').classList.add('hidden');
  document.getElementById('q-finish').classList.add('hidden');
}

function answerQuiz(idx, correct, fb, opts){
  Array.from(opts.children).forEach(b=>b.disabled=true);
  opts.children[idx].classList.add(idx===correct?'ok':'bad');
  
  if(idx===correct){ 
    playSound('success');
    QS.correct++; 
  } else { 
    playSound('fail');
    opts.children[correct].classList.add('ok'); 
  }
  
  const fbEl=document.getElementById('q-feedback');
  
  const cleanFb = fb.replace('✅ 正確！', '').trim();
  
  if (idx === correct) {
    fbEl.innerHTML = `<b class="text-emerald-400 text-lg">✅ 答對了！</b> <span class="ml-1 tracking-wide">${cleanFb}</span>`;
  } else {
    const correctText = opts.children[correct].textContent;
    fbEl.innerHTML = `<b class="text-rose-400 text-lg">❌ 答錯了！</b> 正確應為：<span class="text-white font-bold tracking-wide">${correctText}</span><br><br><span class="opacity-90 tracking-wide">${cleanFb}</span>`;
  }
  
  fbEl.className=`mt-5 p-5 rounded-xl text-base leading-relaxed border shadow-lg ${idx===correct?'bg-emerald-400/15 border-emerald-400/40 text-emerald-200':'bg-rose-400/15 border-rose-400/40 text-rose-200'}`;
  
  if(QS.idx<QS.total-1) document.getElementById('q-next').classList.remove('hidden');
  else document.getElementById('q-finish').classList.remove('hidden');
}

document.getElementById('q-next').onclick=()=>{ playSound('click'); QS.idx++; renderQuizQuestion(); };

document.getElementById('q-finish').onclick=()=>{
  playSound('click');
  closeModal('m-quiz');
  setTimeout(showMissionComplete, 300);
};

function showMissionComplete(){
  playSound('success'); // Big success sound
  const m=MISSIONS[QS.mission];
  const xpGain=Math.round(m.xp*(QS.correct/QS.total));
  S.xp+=xpGain;
  S.done.add(QS.mission);
  if(QS.mission+1<MISSIONS.length) S.unlocked.add(QS.mission+1);
  
  document.getElementById('mc-emoji').textContent=['📊','🧪','⚙️','🚀','📡','🔄'][QS.mission];
  document.getElementById('mc-subtitle').textContent=m.name;
  document.getElementById('mc-xp').textContent=`+${xpGain}`;
  document.getElementById('mc-score').textContent=`${Math.round(QS.correct/QS.total*100)}%`;
  document.getElementById('mc-summary').innerHTML=m.summary;
  
  if(QS.mission+1<MISSIONS.length){
    document.getElementById('mc-unlock-msg').textContent=`🔓 已解鎖下一關：${MISSIONS[QS.mission+1].name}`;
    const nb=document.getElementById('mc-next-btn');
    nb.classList.remove('hidden');
    nb.onclick=()=>{ closeMissionComplete(); startMission(QS.mission+1); };
  } else {
    document.getElementById('mc-unlock-msg').textContent='🎉 恭喜！你已完成全部 6 關 MLOps 星際訓練！';
    document.getElementById('mc-next-btn').classList.add('hidden');
  }
  openModal('m-complete');
}

function closeMissionComplete(){
  closeModal('m-complete');
  exitMission();
}
